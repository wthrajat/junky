name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins
      - run: gh release create "${{ github.ref_name }}" target/release/junky.exe target/release/junky-gui.exe --title "${{ github.ref_name }}" --notes "Junky for Windows. Run junky-gui.exe for the desktop app or junky.exe for the CLI. Portable, no installer. The build is unsigned, so SmartScreen asks once: choose More info, then Run anyway."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
