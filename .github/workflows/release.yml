name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins
        shell: bash
      - run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2)
          gh release create "v$VERSION" target/release/junky.exe target/release/junky-gui.exe --title "v$VERSION" --notes "Junky for Windows. Run junky-gui.exe for the desktop app or junky.exe for the CLI. Portable, no installer. The build is unsigned, so SmartScreen asks once: choose More info, then Run anyway."
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
