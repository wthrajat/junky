[package]
name = "junky"
version = "0.1.0"
edition = "2024"
description = "Junky, a safe scan-first junk cleaner for Windows"
license = "MIT"

[[bin]]
name = "junky"
path = "src/main.rs"

[[bin]]
name = "junky-gui"
path = "src/bin/junky-gui.rs"

[lib]
name = "junky"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
